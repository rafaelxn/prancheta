if(k=="c")tn(520,.06,"sine",.08,0);else if(k=="w"){tn(2900,.18,"square",.04,0);tn(3100,.22,"square",.04,.2)}
else if(k=="g"){nz(1.6,.3);[523,659,784,1047].forEach((f,i)=>tn(f,.3,"triangle",.1,i*.09))}
else if(k=="y")tn(300,.18,"sawtooth",.05,0);else if(k=="r")tn(220,.4,"sawtooth",.07,0);else if(k=="s")tn(180,.12,"sine",.07,0)}catch(e){}}
/* ---- ações ---- */
const act={
pick:v=>{PK=+v;render()},start:()=>init(PK),dv:v=>{DV=+v;render()},sub:v=>{SB[TAB]=v;SEL=null;render();scrollTo(0,0)},up:v=>{const p=G.ba.splice(+v,1)[0];G.teams[G.my].pl.push({n:p.n,p:p.p,o:p.o,g:0});save();render();snd("g")},mute:()=>{MU=!MU;try{localStorage.setItem("bras26:mute",MU?"1":"0")}catch(e){}render()},
reg:async()=>{const u=$("#u").value.trim(),p=$("#p").value;if(!/^[\w.-]{3,16}$/.test(u))return er("Usuário: 3 a 16 letras, números, ponto ou hífen.");if(p.length<4)return er("A senha precisa ter 4 caracteres ou mais.");const a=acc();if(a[u])return er("Esse usuário já existe. Toque em Entrar.");try{a[u]=await hs(u,p);localStorage.setItem("bras26:acc",JSON.stringify(a))}catch(e){return er("Não foi possível criar a conta neste navegador.")}AC=u;SC="menu";render()},
log:async()=>{const u=$("#u").value.trim(),a=acc();try{if(a[u]&&a[u]==await hs(u,$("#p").value)){AC=u;SC="menu";render();return}}catch(e){}er("Usuário ou senha incorretos.")},
go:()=>{load();if(G){SC="game";TAB="in";DV=null}else SC="coach";render()},
co:()=>{sy();SC="coach";render()},out:()=>{AC=null;G=null;SC="login";render()},
ph:v=>{sy();CO.ph=+v;render()},sp:v=>{sy();CO.sp=v;render()},clb:()=>{sy();if(!CO.n)CO.n=AC;SC="club";render()},cd:v=>{CD=+v;PK=null;render()},
tab:v=>{TAB=v;SEL=null;RC=0;render();scrollTo(0,0);const a=$("#app");a.classList.remove("pg");void a.offsetWidth;a.classList.add("pg");setTimeout(()=>a.classList.remove("pg"),500)},
fm:v=>{const t=G.teams[G.my];t.f=v;t.xi=auto(t,v);SEL=null;save();render()},
auto:()=>{const t=G.teams[G.my];t.xi=auto(t,t.f);SEL=null;save();render()},
men:v=>{G.teams[G.my].m=v;save();render()},
play:()=>play(1),sim:()=>play(0),nxt:()=>newSeason(),
rst:()=>{if(!RC){RC=1;render();return}try{localStorage.removeItem("bras26:"+AC)}catch(e){}G=null;PK=null;RC=0;SC="menu";render()},
sw:v=>{const t=G.teams[G.my];if(!SEL||SEL==v){SEL=SEL==v?null:v;render();return}
const a=SEL[0],b=v[0],i=+SEL.slice(1),j=+v.slice(1);
if(a=="b"&&b=="b"){SEL=v;render();return}
if(a=="x"&&b=="x"){[t.xi[i],t.xi[j]]=[t.xi[j],t.xi[i]]}else if(a=="x"){t.xi[i]=j}else{t.xi[j]=i}
SEL=null;save();render()},
lmen:v=>{L.S.me.m=v;document.querySelectorAll("#lm button").forEach(b=>b.classList.toggle("on",b.dataset.v==v))},
pp:()=>{L.pa=!L.pa;$("#pp").textContent=L.pa?"Continuar":"Pausar"},
spd:()=>{L.sp=(L.sp+1)%3;$("#spd").textContent=["1×","2×","5×"][L.sp]},
skp:()=>{const S=L.S;while(S.min<S.end)step(S);lvUp();lvEnd()},
lvdone:()=>{$("#lv").hidden=true;clearTimeout(tm);const f=L.done;L=null;f()}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&act[b.dataset.a]){snd("c");act[b.dataset.a](b.dataset.v)}});
let tx=0,ty=0;addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});addEventListener("touchend",e=>{if(SC!="game"||L)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>80&&Math.abs(dy)<40){const o=["in","tm","fi","ca"],n=o[o.indexOf(TAB)+(dx<0?1:-1)];if(n)act.tab(n)}},{passive:true});
render();
</script></body></html>
